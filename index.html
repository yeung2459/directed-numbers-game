<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>有向數加減練習</title>
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #f2f7f7;
  --card: #ffffff;
  --ink: #12313a;
  --muted: #58727a;
  --rule: #cddcde;
  --accent: #028090;
  --accent-strong: #02606c;
  --on-accent: #ffffff;
  --pos: #b8480a;
  --neg: #05545e;
  --ok: #1b8049;
  --ok-bg: #e3f4ea;
  --bad: #b92b36;
  --bad-bg: #fbe7e9;
  --key: #e4eff0;
  --key-press: #cfe2e4;
  --gold: #f5b301;
  --gold-deep: #b97f00;
  --num: "Times New Roman", Times, "Noto Serif TC", "Songti TC", serif;
  --ui: "Microsoft JhengHei", "PingFang TC", "Noto Sans TC", "Noto Sans CJK TC", "Heiti TC", system-ui, sans-serif;
}
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
*, *::before, *::after { box-sizing: inherit; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--ui);
  line-height: 1.5;
  -webkit-tap-highlight-color: transparent;
}
[hidden] { display: none !important; }
button {
  font: inherit;
  color: inherit;
  cursor: pointer;
  touch-action: manipulation;
  -webkit-user-select: none;
  user-select: none;
}
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.app { max-width: 760px; margin: 0 auto; padding: 64px 14px 28px; }
.langBtn {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); right: 14px; z-index: 40;
  min-height: 34px; padding: 0 15px; border-radius: 999px;
  background: var(--card); border: 1.5px solid var(--rule); color: var(--ink);
  font-weight: 700; font-size: 14px; box-shadow: 0 1px 4px rgba(0,0,0,.10);
}
.langBtn:active { background: var(--key); }
.num { font-family: var(--num); }

/* generic buttons */
.btn {
  border: 0; border-radius: 12px; min-height: 48px; padding: 0 18px;
  background: var(--key); font-weight: 700; font-size: 18px;
}
.btn:active { background: var(--key-press); }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.primary:active { background: var(--accent-strong); }
.btn.small { min-height: 40px; font-size: 15px; padding: 0 14px; }
.btn[disabled], .btn.end { opacity: .38; pointer-events: none; }

/* home */
h1 { font-size: clamp(30px, 7vw, 44px); line-height: 1.15; margin: 22px 0 6px; letter-spacing: .02em; }
.lead { margin: 0 0 22px; color: var(--muted); font-size: 18px; }
.levels { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .levels { grid-template-columns: 1fr 1fr; } }
.level {
  display: flex; flex-direction: column; gap: 6px; text-align: left;
  padding: 18px 18px 14px; border-radius: 18px; border: 2px solid var(--rule);
  background: var(--card); min-height: 176px;
}
.level:hover { border-color: var(--accent); }
.level:active { background: var(--key); }
.level .name { font-size: 26px; font-weight: 800; }
.level .desc { color: var(--muted); font-size: 16px; }
.level .pv { margin-top: auto; padding-top: 8px; }
.pv2 { font-size: 34px; color: var(--ink); }
.foot { margin-top: 26px; }
.linkish { background: none; border: 0; padding: 8px 0; color: var(--muted); font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

/* game */
.testtag { font-size: 13px; padding: 2px 10px; border-radius: 999px; background: var(--gold); color: #3b2a00; font-weight: 700; }
.scorebar { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.scoretext { font-size: 18px; white-space: nowrap; }
.scoretext b { font-size: 26px; font-family: var(--num); display: inline-block; min-width: 1.4em; text-align: center; }
.scoretext b.bump { animation: bump .35s ease-out; }
@keyframes bump { 0% { transform: scale(1.5); color: var(--accent); } 100% { transform: scale(1); } }
.track { position: relative; flex: 1; height: 14px; background: var(--key); border-radius: 999px; overflow: hidden; }
.fill { height: 100%; width: 0; background: var(--accent); border-radius: 999px; transition: width .35s ease; }
.goalstar { width: 34px; height: 34px; flex: none; }
.goalstar polygon { fill: none; stroke: var(--muted); stroke-width: 5; stroke-linejoin: round; }
.goalstar.lit polygon { fill: var(--gold); stroke: var(--gold-deep); }

.qcard { background: var(--card); border: 1px solid var(--rule); border-radius: 18px; padding: 8px 16px 6px; text-align: center; }
.qmeta { display: flex; align-items: center; justify-content: space-between; gap: 8px; color: var(--muted); font-size: 15px; }
.qmeta .rule { color: var(--ink); font-weight: 700; }
.expr { font-size: clamp(38px, 10vw, 62px); line-height: 1.2; white-space: nowrap; }
.work { margin-top: 2px; }
.wline { font-size: clamp(26px, 6.6vw, 38px); line-height: 1.7; white-space: normal; }
.blank {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 1em; min-height: .92em; padding: 0 .12em; margin: 0 .07em;
  border: 3px solid var(--rule); border-radius: 8px; background: var(--card);
  font: inherit; font-family: var(--num); color: var(--muted); vertical-align: -0.08em; line-height: 1;
}
.blank.pending { opacity: .4; pointer-events: none; }
.blank.active { border-color: var(--accent); background: var(--key); color: var(--ink); }
.blank.filled { color: var(--ink); }
.blank.ok { border-color: var(--ok); background: var(--ok-bg); color: var(--ok); }
.blank.bad { border-color: var(--bad); background: var(--bad-bg); color: var(--bad); }
.qcard.steps .expr, .qcard.steps .work { text-align: left; }
.qcard.steps .wline { padding-left: 1.05em; }
.fb { min-height: 48px; margin: 2px -4px 0; padding: 4px 10px; border-radius: 12px; font-size: 17px; font-weight: 700; display: flex; flex-direction: column; justify-content: center; }
.fb small { font-weight: 500; font-size: 15px; }
.fb.ok { background: var(--ok-bg); color: var(--ok); }
.fb.bad { background: var(--bad-bg); color: var(--bad); }

.nlwrap { margin-top: 10px; overflow-x: auto; overflow-y: hidden; background: var(--card); border: 1px solid var(--rule); border-radius: 18px; -webkit-overflow-scrolling: touch; }
#nl { display: block; margin: 0 auto; }
#nl .axis { stroke: var(--ink); stroke-width: 2.5; stroke-linecap: round; fill: none; }
#nl .tick { stroke: var(--ink); stroke-width: 2; }
#nl .tick.zero { stroke-width: 3; }
#nl .lab { font-family: var(--num); font-size: 15px; fill: var(--ink); text-anchor: middle; }
#nl .lab.neg { fill: var(--neg); }
#nl .lab.pos { fill: var(--pos); }
#nl .lab.zero { font-weight: 700; }
#nl .pole { stroke: var(--ink); stroke-width: 2; }
#nl .flag { fill: var(--pos); }
#nl .badge { fill: var(--card); stroke: var(--accent); stroke-width: 2; }
#nl .badgeT { font: 700 13px var(--ui); fill: var(--accent-strong); text-anchor: middle; }
#nl .hl { fill: none; stroke: var(--ok); stroke-width: 3; }
#nl .body { fill: var(--accent); }
#nl .feet { fill: var(--accent-strong); }
#nl .pupil { fill: #12313a; }
#nl .smile { fill: none; stroke: #ffffff; stroke-width: 1.8; stroke-linecap: round; }
.nlctl { display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px; margin-top: 8px; align-items: center; }
.move { font-size: 19px; padding: 0 8px; }
.nlmid { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 88px; font-size: 14px; color: var(--muted); }
.btn.tiny { min-height: 30px; font-size: 14px; padding: 0 14px; border-radius: 9px; }

.answerRow { display: grid; grid-template-columns: 1fr auto; gap: 8px; max-width: 400px; margin: 10px auto 0; }
.ans {
  min-height: 56px; display: flex; align-items: center; justify-content: center;
  font-size: 34px; background: var(--card); border: 3px solid var(--rule); border-radius: 14px;
}
.ans.empty { color: var(--muted); }
.ans.ok { border-color: var(--ok); }
.ans.bad { border-color: var(--bad); }
.ans.shake { animation: shake .3s; }
@keyframes shake { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(4px); } }
.confirm { min-width: 112px; min-height: 56px; }
.signpad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; max-width: 400px; margin: 10px auto 0; }
.signkey { min-height: 60px; font-size: 32px; font-weight: 700; border: 0; border-radius: 14px; background: var(--accent); color: var(--on-accent); font-family: var(--num); }
.signkey:active { background: var(--accent-strong); }
.ans.pending { opacity: .35; }
.keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; max-width: 400px; margin: 8px auto 0; }
.keypad.locked { opacity: .45; pointer-events: none; }
.key { min-height: 52px; font-size: 26px; font-weight: 600; border: 0; border-radius: 12px; background: var(--key); font-family: var(--ui); }
.key:active { background: var(--key-press); }
.play { display: block; }
@media (max-height: 760px) {
  .key { min-height: 44px; font-size: 24px; }
  .confirm, .ans { min-height: 48px; }
  .expr { font-size: clamp(34px, 9vw, 50px); }
  .answerRow, .keypad { margin-top: 6px; gap: 6px; }
}
@media (min-width: 1080px) {
  .app { max-width: 1080px; }
  .play { display: grid; grid-template-columns: 1fr 340px; gap: 22px; align-items: start; }
  .colR .answerRow, .colR .keypad { max-width: none; margin-left: 0; margin-right: 0; }
  .colR .answerRow { margin-top: 0; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>
<body>
<button id="langToggle" class="langBtn" type="button">EN</button>
<main class="app">

  <!-- 首頁 -->
  <section id="home">
    <h1 id="pageTitle">有向數加減練習</h1>
    <p class="lead" id="leadText">選擇程度，開始練習。</p>
    <div class="levels">
      <button class="level" data-level="1" type="button">
        <span class="name" id="lv1Name">程度一</span>
        <span class="desc" id="lv1Desc">有數線幫忙，一步一步數腳步</span>
        <span class="pv" aria-hidden="true">
          <svg viewBox="0 0 240 58" width="100%" height="58">
            <line x1="6" y1="42" x2="234" y2="42" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
            <g stroke="var(--ink)" stroke-width="2">
              <line x1="20" y1="37" x2="20" y2="47"/><line x1="40" y1="37" x2="40" y2="47"/><line x1="60" y1="37" x2="60" y2="47"/>
              <line x1="80" y1="37" x2="80" y2="47"/><line x1="100" y1="37" x2="100" y2="47"/><line x1="120" y1="36" x2="120" y2="48" stroke-width="3"/>
              <line x1="140" y1="37" x2="140" y2="47"/><line x1="160" y1="37" x2="160" y2="47"/><line x1="180" y1="37" x2="180" y2="47"/>
              <line x1="200" y1="37" x2="200" y2="47"/><line x1="220" y1="37" x2="220" y2="47"/>
            </g>
            <path d="M160,30 Q120,-6 80,30" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
            <path d="M88,24 L80,30 L90,34" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="160" cy="30" r="8" fill="var(--accent)"/>
          </svg>
        </span>
      </button>
      <button class="level" data-level="2" type="button">
        <span class="name" id="lv2Name">程度二</span>
        <span class="desc" id="lv2Desc">沒有數線，靠自己計算</span>
        <span class="pv pv2 num" aria-hidden="true">−3 − 4 = ?</span>
      </button>
      <button class="level" data-level="3" type="button">
        <span class="name" id="lv3Name">程度三</span>
        <span class="desc" id="lv3Desc">有數線幫忙，拆括號逐步作答</span>
        <span class="pv" aria-hidden="true">
          <svg viewBox="0 0 240 58" width="100%" height="58">
            <line x1="6" y1="42" x2="234" y2="42" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"/>
            <g stroke="var(--ink)" stroke-width="2">
              <line x1="20" y1="37" x2="20" y2="47"/><line x1="40" y1="37" x2="40" y2="47"/><line x1="60" y1="37" x2="60" y2="47"/>
              <line x1="80" y1="37" x2="80" y2="47"/><line x1="100" y1="37" x2="100" y2="47"/><line x1="120" y1="36" x2="120" y2="48" stroke-width="3"/>
              <line x1="140" y1="37" x2="140" y2="47"/><line x1="160" y1="37" x2="160" y2="47"/><line x1="180" y1="37" x2="180" y2="47"/>
              <line x1="200" y1="37" x2="200" y2="47"/><line x1="220" y1="37" x2="220" y2="47"/>
            </g>
            <path d="M160,30 Q120,-6 80,30" fill="none" stroke="var(--accent)" stroke-width="3" stroke-dasharray="6 5" stroke-linecap="round"/>
            <path d="M88,24 L80,30 L90,34" fill="none" stroke="var(--accent)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="160" cy="30" r="8" fill="var(--accent)"/>
          </svg>
        </span>
      </button>
      <button class="level" data-level="4" type="button">
        <span class="name" id="lv4Name">程度四</span>
        <span class="desc" id="lv4Desc">沒有數線，拆括號逐步作答</span>
        <span class="pv pv2 num" aria-hidden="true">(−6) − (+11) = ?</span>
      </button>
    </div>
    <div class="foot"><button id="testToggle" class="linkish" type="button"></button></div>
  </section>

  <!-- 遊戲 -->
  <section id="game" hidden>
    <div class="scorebar">
      <button id="backBtn" class="btn small" type="button">← 首頁</button>
      <div class="scoretext"><span id="scoreLabel">分數</span> <b id="score">0</b> / <span id="target">50</span></div>
      <div class="track"><div class="fill" id="fill"></div></div>
      <svg class="goalstar" id="goalStar" viewBox="0 0 40 40" aria-hidden="true"><polygon id="goalPoly"/></svg>
    </div>

    <div class="play">
      <div class="colL">
        <div class="qcard" id="qcard">
          <div class="qmeta">
            <span id="qno">程度一　第 1 題</span>
            <span class="testtag" id="testTag" hidden>測試模式</span>
            <span class="rule" id="nlRule">＋ 向右走　－ 向左走</span>
          </div>
          <div class="expr num" id="expr">&nbsp;</div>
          <div class="work num" id="work" hidden></div>
          <div class="fb" id="fb" role="status" aria-live="polite"></div>
        </div>

        <div id="nlBlock">
          <div class="nlwrap" id="nlWrap">
            <svg id="nl" role="img" aria-label="由 −10 至 +10 的數線"></svg>
          </div>
          <div class="nlctl">
            <button id="goL" class="btn move" type="button" aria-label="向左一步">◀ 向左</button>
            <div class="nlmid">
              <span id="stepInfo">已走 0 步</span>
              <button id="resetNL" class="btn tiny" type="button">重來</button>
            </div>
            <button id="goR" class="btn move" type="button" aria-label="向右一步">向右 ▶</button>
          </div>
        </div>
      </div>

      <div class="colR">
        <div class="signpad" id="signPad" hidden>
          <button class="signkey" data-s="+" type="button" aria-label="正號">＋</button>
          <button class="signkey" data-s="−" type="button" aria-label="負號">－</button>
        </div>
        <div class="answerRow">
          <div class="ans num empty" id="ans" aria-live="polite">?</div>
          <button id="ok" class="btn primary confirm" type="button">確定</button>
        </div>
        <div class="keypad" id="keypad">
          <button class="key" data-k="7" type="button">7</button>
          <button class="key" data-k="8" type="button">8</button>
          <button class="key" data-k="9" type="button">9</button>
          <button class="key" data-k="4" type="button">4</button>
          <button class="key" data-k="5" type="button">5</button>
          <button class="key" data-k="6" type="button">6</button>
          <button class="key" data-k="1" type="button">1</button>
          <button class="key" data-k="2" type="button">2</button>
          <button class="key" data-k="3" type="button">3</button>
          <button class="key" data-k="neg" type="button" aria-label="負號">−</button>
          <button class="key" data-k="0" type="button">0</button>
          <button class="key" data-k="del" type="button" aria-label="刪除">⌫</button>
        </div>
      </div>
    </div>
  </section>

</main>

<script>
(function () {
'use strict';

/*LOGIC-START*/
var MIN = -10, MAX = 10, TARGET = 50, TEST_TARGET = 3;
function fmt(n) { return n < 0 ? '\u2212' + (-n) : String(n); }
function shuffle(a) {
  for (var i = a.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}
function allQuestions() {
  var p = [];
  for (var a = MIN; a <= MAX; a++) {
    ['+', '-'].forEach(function (op) {
      for (var b = 1; b <= 10; b++) {
        var r = op === '+' ? a + b : a - b;
        if (r >= MIN && r <= MAX) p.push({ a: a, op: op, b: b, ans: r });
      }
    });
  }
  return p;
}
function exprText(q) { return fmt(q.a) + ' ' + (q.op === '+' ? '+' : '\u2212') + ' ' + q.b; }
function pressKey(ans, k) {
  if (k === 'del') return ans.slice(0, -1);
  if (k === 'neg') {
    if (ans === '0') return '-';
    return ans.charAt(0) === '-' ? ans.slice(1) : '-' + ans;
  }
  var neg = ans.charAt(0) === '-';
  var d = neg ? ans.slice(1) : ans;
  if (d === '0') return k === '0' ? ans : (neg ? '-' : '') + k;
  if (k === '0' && neg && d === '') return ans;
  if (d.length >= 2) return ans;
  return ans + k;
}
function parseAns(s) { return (s === '' || s === '-') ? null : parseInt(s, 10); }
function scoreAfter(score, correct) { return correct ? score + 1 : Math.max(0, score - 1); }
function signedParen(n) { return '(' + (n >= 0 ? '+' : '\u2212') + Math.abs(n) + ')'; }
function opSym(op) { return op === '+' ? '+' : '\u2212'; }
function deriveBracket(a, OP, bSign, bAbs) {
  var bVal = bSign === '+' ? bAbs : -bAbs;
  var resolved = OP === '+' ? bVal : -bVal;
  var op1 = resolved >= 0 ? '+' : '\u2212';
  var aAbs = Math.abs(a), s1 = a >= 0 ? '+' : '\u2212';
  var s2 = op1;
  var skip = (aAbs === bAbs) && (s1 !== s2);
  var sign2 = null, op2 = null, dispLeft = null, dispRight = null;
  if (!skip) {
    if (s1 === s2) {
      sign2 = s1; op2 = '+'; dispLeft = aAbs; dispRight = bAbs;
    } else if (aAbs > bAbs) {
      sign2 = s1; op2 = '\u2212'; dispLeft = aAbs; dispRight = bAbs;
    } else {
      sign2 = s2; op2 = '\u2212'; dispLeft = bAbs; dispRight = aAbs;
    }
  }
  var ans = a + resolved;
  return {
    a: a, OP: OP, bSign: bSign, bAbs: bAbs, bVal: bVal,
    op1: op1, aAbs: aAbs, skip: skip, sign2: sign2, op2: op2,
    dispLeft: dispLeft, dispRight: dispRight, ans: ans
  };
}
function allBracketQuestions() {
  var p = [];
  var as = [];
  for (var v = MIN; v <= MAX; v++) { if (v !== 0) as.push(v); }
  as.forEach(function (a) {
    ['+', '\u2212'].forEach(function (OP) {
      ['+', '\u2212'].forEach(function (bSign) {
        for (var bAbs = 1; bAbs <= 10; bAbs++) {
          var q = deriveBracket(a, OP, bSign, bAbs);
          if (q.ans >= MIN && q.ans <= MAX) p.push(q);
        }
      });
    });
  });
  return p;
}
var LEVEL_NAME = { 1: '\u7a0b\u5ea6\u4e00', 2: '\u7a0b\u5ea6\u4e8c', 3: '\u7a0b\u5ea6\u4e09', 4: '\u7a0b\u5ea6\u56db' };
/*LOGIC-END*/

var $ = function (id) { return document.getElementById(id); };
var reduce = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
var sleep = function (ms) { return new Promise(function (r) { setTimeout(r, reduce ? 0 : ms); }); };

var S = { level: 1, test: false, score: 0, total: 0, right: 0, pool: [], q: null, ans: '', phase: 'idle', qn: 0, timer: null, blanks: null, active: 0, lang: 'zh' };

/* ---------- 語言 翻譯 ---------- */
var TR = {
  zh: {
    title: '有向數加減練習',

$('ok').addEventListener('click', onOk);
$('backBtn').addEventListener('click', function () { clearTimeout(S.timer); S.phase = 'idle'; show('home'); });
$('testToggle').addEventListener('click', function () { S.test = !S.test; syncTest(); });
$('langToggle').addEventListener('click', function () { S.lang = S.lang === 'zh' ? 'en' : 'zh'; applyLang(); });

document.addEventListener('keydown', function (e) {
  if ($('game').hidden || e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.target.closest && e.target.closest('#backBtn, #resetNL')) return;
  var k = e.key;
  var onSign = S.level >= 3 && S.phase === 'ask' && S.blanks && S.blanks[S.active] && S.blanks[S.active].type === 'sign';
  if (onSign && (k === '+' || k === '-' || k === '\u2212')) { e.preventDefault(); doSign(k === '+' ? '+' : '\u2212'); }
  else if (/^[0-9]$/.test(k)) { e.preventDefault(); press(k); }
  else if (k === '-' || k === '\u2212') { e.preventDefault(); press('neg'); }
  else if (k === 'Backspace' || k === 'Delete') { e.preventDefault(); press('del'); }
  else if (k === 'Enter') { e.preventDefault(); onOk(); }
  else if ((S.level === 1 || S.level === 3) && S.phase === 'ask' && k === 'ArrowLeft') { e.preventDefault(); NL.move(-1, 200); }
  else if ((S.level === 1 || S.level === 3) && S.phase === 'ask' && k === 'ArrowRight') { e.preventDefault(); NL.move(1, 200); }
});

var rz;
window.addEventListener('resize', function () {
  clearTimeout(rz);
  rz = setTimeout(function () { if (!$('game').hidden && (S.level === 1 || S.level === 3)) { NL.layout(); NL.follow(true); } }, 120);
});

applyLang();
window.__qa = { S: S, NL: NL, allQuestions: allQuestions, allBracketQuestions: allBracketQuestions, deriveBracket: deriveBracket, pressKey: pressKey, applyLang: applyLang, TR: TR };
})();
</script>
</body>
